services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jatevo-backend
    restart: unless-stopped
    environment:
      - JATEVO_API_KEY=${JATEVO_API_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: nginx:alpine
    container_name: jatevo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend.html:/usr/share/nginx/html/frontend.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
